# itoolbox-data-platform — local data stack: TimescaleDB, JupyterLab, ingestion
#
# IToolbox's own database, where BantAI's data lands first and is governed locally.
# Load data here and explore it in notebooks; register it in Zetaris
# (../itoolbox-zetaris-platform) when the agent should be able to query it.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d                          # TimescaleDB :5436, Jupyter :8890, hourly ingest
#   docker compose up -d itoolbox-timescaledb     # TimescaleDB only
#
# Both ports bind to 127.0.0.1, like the rest of IToolbox. Jupyter's token is in
# its logs (docker compose logs itoolbox-jupyter) unless JUPYTER_TOKEN is set.
#
# name: Docker Desktop lists the IToolbox stacks together by the "itoolbox_" prefix:
# itoolbox_frontend, itoolbox_data-platform, itoolbox_zetaris-platform and
# itoolbox_backend. Each repo is its own project, so
# `docker compose down` here never touches the others. Services are named after
# their containers.
name: itoolbox_data-platform

# BagyoAPI (github.com/edwardguevarra/bagyo-api, MIT): PAGASA tropical cyclone
# bulletins parsed into a REST API. Self-hosted and built from a pinned commit, so
# none of its code lives in this repo; bump the commit to upgrade it.
x-bagyo-build: &bagyo-build
  context: "https://github.com/edwardguevarra/bagyo-api.git#92f509f789e4b8a22995f135e1501d7025c7c8d7"
  dockerfile: Dockerfile
x-bagyo-env: &bagyo-env
  NODE_ENV: production
  DATABASE_URL: "postgresql://bagyo:${BAGYO_DB_PASSWORD:-bagyo}@bagyo-postgres:5432/bagyo?schema=public"
  REDIS_URL: "redis://bagyo-redis:6379"
  APP_SECRET: "${BAGYO_APP_SECRET:?set BAGYO_APP_SECRET in .env -- see .env.example}"
  # Sent to PAGASA with every fetch. BagyoAPI paces itself: every 10 minutes while
  # a storm is active, every 30 otherwise, 5 s apart per host, with backoff.
  SCRAPER_USER_AGENT: "BantAI-BagyoAPI/1.0 (IToolbox; +https://github.com/IToolboxPH)"
  INGEST_ENABLED: "${BAGYO_LIVE_SCRAPING:-true}"

services:
  itoolbox-timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: itoolbox-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TIMESCALE_HOST_PORT:-5436}:5432"
    environment:
      POSTGRES_DB: "${TIMESCALE_DB:-itoolbox_db}"
      POSTGRES_USER: "${TIMESCALE_USER:-itoolbox}"
      POSTGRES_PASSWORD: "${TIMESCALE_PASSWORD:-itoolbox}"
    volumes:
      - itoolbox_tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-itoolbox} -d ${TIMESCALE_DB:-itoolbox_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  itoolbox-jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    image: itoolbox-jupyter
    container_name: itoolbox-jupyter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8890}:8888"
    environment:
      # Inside the compose network the database is `itoolbox-timescaledb`, not `localhost`.
      TIMESCALE_URL: "postgresql://${TIMESCALE_USER:-itoolbox}:${TIMESCALE_PASSWORD:-itoolbox}@itoolbox-timescaledb:5432/${TIMESCALE_DB:-itoolbox_db}"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-}"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./scripts:/workspace/scripts
    depends_on:
      itoolbox-timescaledb:
        condition: service_healthy

  # Every ingestion job (scripts/run_ingest.py), each on its own schedule, into the
  # schemas Zetaris serves to BantAI: weather, hazards, typhoons, reference and
  # bulletins. Same image as Jupyter. A job that fails is logged and retried on its
  # next turn; the others carry on.
  itoolbox-ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    image: itoolbox-jupyter
    container_name: itoolbox-ingest
    restart: unless-stopped
    entrypoint: ["tini", "--", "python", "/workspace/scripts/run_ingest.py"]
    environment:
      TIMESCALE_URL: "postgresql://${TIMESCALE_USER:-itoolbox}:${TIMESCALE_PASSWORD:-itoolbox}@itoolbox-timescaledb:5432/${TIMESCALE_DB:-itoolbox_db}"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:-}"
      BAGYO_API_URL: "http://bagyo-api:3000"
    volumes:
      - ./scripts:/workspace/scripts:ro
    depends_on:
      itoolbox-timescaledb:
        condition: service_healthy

  # ── BagyoAPI ──────────────────────────────────────────────────────────────
  # Its own Postgres and Redis, reachable only inside this compose network. The
  # API is published on loopback for its /docs; the ingest job reads it from
  # inside the network. The seed loads six real 2026 PAGASA bulletins and a demo
  # account (demo@bagyo-api.local); keep the API off any shared network.
  bagyo-postgres:
    image: postgres:16-alpine
    container_name: bagyo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bagyo
      POSTGRES_PASSWORD: "${BAGYO_DB_PASSWORD:-bagyo}"
      POSTGRES_DB: bagyo
    volumes:
      - itoolbox_bagyo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagyo -d bagyo"]
      interval: 5s
      timeout: 3s
      retries: 20

  bagyo-redis:
    image: redis:7-alpine
    container_name: bagyo-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bagyo-migrate:
    build:
      <<: *bagyo-build
      target: migrate
    image: bagyo-api-migrate:92f509f
    container_name: bagyo-migrate
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://bagyo:${BAGYO_DB_PASSWORD:-bagyo}@bagyo-postgres:5432/bagyo?schema=public"
    depends_on:
      bagyo-postgres:
        condition: service_healthy

  bagyo-seed:
    build:
      <<: *bagyo-build
      target: migrate
    image: bagyo-api-migrate:92f509f
    container_name: bagyo-seed
    restart: "no"
    command: ["node", "apps/worker/dist/seed.js"]
    environment:
      DATABASE_URL: "postgresql://bagyo:${BAGYO_DB_PASSWORD:-bagyo}@bagyo-postgres:5432/bagyo?schema=public"
    depends_on:
      bagyo-migrate:
        condition: service_completed_successfully

  bagyo-api:
    build:
      <<: *bagyo-build
      target: api
    image: bagyo-api:92f509f
    container_name: bagyo-api
    restart: unless-stopped
    environment:
      <<: *bagyo-env
      API_HOST: 0.0.0.0
      API_PORT: "3000"
    ports:
      - "127.0.0.1:${BAGYO_API_PORT:-3200}:3000"
    depends_on:
      bagyo-migrate:
        condition: service_completed_successfully
      bagyo-redis:
        condition: service_healthy

  bagyo-worker:
    build:
      <<: *bagyo-build
      target: worker
    image: bagyo-api-worker:92f509f
    container_name: bagyo-worker
    restart: unless-stopped
    environment: *bagyo-env
    depends_on:
      bagyo-migrate:
        condition: service_completed_successfully
      bagyo-redis:
        condition: service_healthy

volumes:
  itoolbox_bagyo_pgdata:
    name: itoolbox_bagyo_pgdata
  itoolbox_tsdata:
    # Created under the project's first name, "itoolbox". Compose warns that it "was
    # created for project itoolbox"; that is expected.
    name: itoolbox_tsdata
